<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ · Argentum Investimentos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #06092B;
      --white:    #ffffff;
      --accent:   #b8a060;
      --gray-50:  #f8f9fa;
      --gray-100: #f1f3f5;
      --gray-200: #e9ecef;
      --gray-300: #dee2e6;
      --gray-400: #adb5bd;
      --gray-500: #868e96;
      --gray-600: #495057;
      --gray-700: #343a40;
      --sidebar-w: 260px;
      --header-h: 56px;
      --radius: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-700);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--black);
      height: var(--header-h);
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06);
    }
    .header-logo { height: 24px; object-fit: contain; }
    .header-sep  { width: 1px; height: 20px; background: rgba(255,255,255,0.15); }
    .header-title {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ql-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .ql-link:hover {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.1);
    }
    .header-badge {
      background: rgba(184,160,96,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(184,160,96,0.25);
      margin-left: 6px;
    }

    /* ── SEARCH BAR ── */
    .search-bar {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 12px 24px;
    }
    .search-inner {
      max-width: 680px;
      margin: 0 auto;
      position: relative;
    }
    .search-inner svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      pointer-events: none;
    }
    .search-shortcut {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--gray-100);
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
      color: var(--gray-500);
      font-family: monospace;
      pointer-events: none;
    }
    #search {
      width: 100%;
      padding: 10px 44px 10px 40px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--gray-50);
      color: var(--gray-700);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search::placeholder { color: var(--gray-400); }
    #search:focus {
      border-color: var(--black);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(6,9,43,0.06);
    }
    #search:focus ~ .search-shortcut { opacity: 0; }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      min-height: calc(100vh - var(--header-h) - 57px);
    }

    /* ── SIDEBAR ── */
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      padding: 24px 0;
      border-right: 1px solid var(--gray-200);
      background: var(--white);
      position: sticky;
      top: calc(var(--header-h) + 57px);
      height: calc(100vh - var(--header-h) - 57px);
      overflow-y: auto;
    }
    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    aside::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }

    .sidebar-section {
      padding: 0 12px;
      margin-bottom: 4px;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gray-400);
      padding: 8px 8px 6px;
      display: block;
    }
    .cat-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 7px 10px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--gray-600);
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }
    .cat-btn:hover {
      background: var(--gray-100);
      color: var(--gray-700);
    }
    .cat-btn.active {
      background: var(--black);
      color: var(--white);
    }
    .cat-btn .cat-icon {
      font-size: 15px;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
    }
    .cat-btn .cat-count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-400);
      background: var(--gray-100);
      padding: 1px 7px;
      border-radius: 20px;
    }
    .cat-btn.active .cat-count {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
    }

    .sidebar-divider {
      height: 1px;
      background: var(--gray-200);
      margin: 10px 12px;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 24px 28px;
      min-width: 0;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
    }
    .page-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--black);
    }
    .page-header .count {
      font-size: 13px;
      color: var(--gray-400);
    }
    .page-header .view-toggle {
      margin-left: auto;
      display: flex;
      gap: 3px;
      background: var(--gray-200);
      border-radius: 7px;
      padding: 3px;
    }
    .view-btn {
      border: none;
      background: transparent;
      border-radius: 5px;
      padding: 5px 9px;
      cursor: pointer;
      color: var(--gray-500);
      transition: all 0.12s;
      display: flex;
      align-items: center;
    }
    .view-btn.active {
      background: var(--white);
      color: var(--black);
      box-shadow: var(--shadow-sm);
    }

    /* ── ARTICLE LIST ── */
    .article-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .article-list.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }

    /* ── ARTICLE ITEM ── */
    .article {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .article:hover { border-color: var(--gray-300); box-shadow: var(--shadow-sm); }
    .article.open  { border-color: var(--gray-300); box-shadow: var(--shadow-md); }

    .article-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      user-select: none;
    }
    .article-icon {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .article-info { flex: 1; min-width: 0; }
    .article-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--black);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .article-list.grid-view .article-title {
      white-space: normal;
    }
    .article-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 3px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }
    .tag-aud  { background: var(--gray-100); color: var(--gray-500); border: 1px solid var(--gray-200); }
    .tag-hub  { background: #dcfce7; color: #15803d; }

    .article-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .copy-btn {
      border: none;
      background: transparent;
      padding: 4px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--gray-300);
      opacity: 0;
      transition: opacity 0.15s, color 0.12s, background 0.12s;
      display: flex;
    }
    .article-header:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--gray-100); color: var(--gray-600); }
    .copy-btn.copied { color: #16a34a; opacity: 1; }
    .chevron {
      color: var(--gray-300);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .article.open .chevron { transform: rotate(180deg); }

    /* ── ARTICLE BODY ── */
    .article-body {
      display: none;
      border-top: 1px solid var(--gray-100);
      padding: 16px 16px 18px 58px;
    }
    .article.open .article-body { display: block; }
    .article-content {
      font-size: 13.5px;
      line-height: 1.75;
      color: var(--gray-600);
      white-space: pre-wrap;
    }
    .article-content a     { color: #2563eb; text-decoration: underline; }
    .article-content strong, .article-content b { color: var(--black); }

    /* ── SKELETON ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position: 600px 0; }
    }
    .skeleton {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .sk-block {
      border-radius: 6px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
    }
    .sk-icon  { width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; }
    .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .sk-title { height: 13px; width: 55%; }
    .sk-tag   { height: 16px; width: 25%; border-radius: 20px; }

    /* ── EMPTY ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-400);
    }
    .empty svg { margin-bottom: 14px; opacity: 0.3; }
    .empty p   { font-size: 15px; }

    /* ── BADGE NOVO ── */
    .badge-novo {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 1px 5px;
      border-radius: 20px;
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
      vertical-align: middle;
      margin-left: 4px;
    }

    /* ── CATEGORY COLORS ── */
    .cat-cartao       { background: #fef3c7; color: #92400e; }
    .cat-cadastro     { background: #f3f4f6; color: #374151; }
    .cat-ir           { background: #fee2e2; color: #991b1b; }
    .cat-stvm         { background: #ede9fe; color: #5b21b6; }
    .cat-portab       { background: #ffedd5; color: #9a3412; }
    .cat-prev         { background: #dbeafe; color: #1e40af; }
    .cat-rv           { background: #dcfce7; color: #166534; }
    .cat-credito      { background: #fef9c3; color: #854d0e; }
    .cat-digital      { background: #e0f2fe; color: #075985; }
    .cat-seguros      { background: #e0e7ff; color: #3730a3; }
    .cat-internacional{ background: #ccfbf1; color: #0f766e; }
    .cat-empresas     { background: #cffafe; color: #155e75; }
    .cat-fgts         { background: #ecfccb; color: #3f6212; }
    .cat-bloqueios    { background: #fee2e2; color: #7f1d1d; }
    .cat-cancelamento { background: #fce7f3; color: #9d174d; }
    .cat-garantia     { background: #d1fae5; color: #065f46; }
    .cat-hub          { background: #f3e8ff; color: #6b21a8; }
    .cat-fundos       { background: #fef3c7; color: #78350f; }
    .cat-corretagem   { background: #f1f5f9; color: #334155; }
    .cat-aluguel      { background: #fdf4ff; color: #7e22ce; }
    .cat-outros       { background: #f4f4f5; color: #52525b; }

    /* ── FLOATING ACTIONS ── */
    .fab-group {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 300;
    }
    .fab {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 16px 11px 12px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      transition: transform 0.18s, box-shadow 0.18s;
      white-space: nowrap;
    }
    .fab:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.22); }
    .fab-pipefy   { background: var(--black); color: #fff; }
    .fab-whatsapp { background: #25D366; color: #fff; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 11.5px;
      color: var(--gray-400);
      border-top: 1px solid var(--gray-200);
      background: var(--white);
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      aside { display: none; }
      .layout { flex-direction: column; }
      main { padding: 16px; }
      .fab span { display: none; }
      .fab { padding: 13px; border-radius: 50%; }
    }
  </style>
</head>

<script>
  const CAT_CONFIG = {
    'Cartão':           { icon: '💳', cls: 'cat-cartao' },
    'Cadastro':         { icon: '📋', cls: 'cat-cadastro' },
    'IR':               { icon: '📊', cls: 'cat-ir' },
    'STVM':             { icon: '🔄', cls: 'cat-stvm' },
    'Portabilidade':    { icon: '↔️', cls: 'cat-portab' },
    'Previdência':      { icon: '🏦', cls: 'cat-prev' },
    'Renda Variável':   { icon: '📈', cls: 'cat-rv' },
    'Crédito':          { icon: '💰', cls: 'cat-credito' },
    'Conta Digital':    { icon: '📱', cls: 'cat-digital' },
    'Seguros':          { icon: '🛡️', cls: 'cat-seguros' },
    'XP Internacional': { icon: '🌎', cls: 'cat-internacional' },
    'XP Empresas':      { icon: '🏢', cls: 'cat-empresas' },
    'FGTS':             { icon: '🏗️', cls: 'cat-fgts' },
    'Bloqueios':        { icon: '🔒', cls: 'cat-bloqueios' },
    'Cancelamento':     { icon: '❌', cls: 'cat-cancelamento' },
    'Garantia':         { icon: '🔐', cls: 'cat-garantia' },
    'HUB':              { icon: '🔧', cls: 'cat-hub' },
    'Fundos':           { icon: '📦', cls: 'cat-fundos' },
    'Corretagem':       { icon: '📉', cls: 'cat-corretagem' },
    'Aluguel':          { icon: '🏠', cls: 'cat-aluguel' },
    'Suitability':      { icon: '✅', cls: 'cat-outros' },
    'Informação':       { icon: 'ℹ️', cls: 'cat-outros' },
    'Outros':           { icon: '📌', cls: 'cat-outros' },
  };

  let allItems = [];
  let activeCategory = 'Todos';
  let currentView = 'list';
  const NOVO_DIAS = 14;

  function isNovo(item) {
    const ref = item.criadoEm || item.editadoEm;
    if (!ref) return false;
    return (Date.now() - new Date(ref).getTime()) < NOVO_DIAS * 86400000;
  }

  /* ── LOAD ── */
  async function loadFAQ() {
    const skHtml = Array(10).fill(`
      <div class="skeleton">
        <div class="sk-block sk-icon"></div>
        <div class="sk-lines">
          <div class="sk-block sk-title"></div>
          <div class="sk-block sk-tag"></div>
        </div>
      </div>`).join('');
    document.getElementById('article-list').innerHTML = skHtml;

    try {
      const res = await fetch('/api/faq');
      if (!res.ok) throw new Error(`Erro ${res.status}`);
      allItems = await res.json();
      buildSidebar();
      render();
    } catch (e) {
      document.getElementById('article-list').innerHTML = `
        <div class="empty">
          <p>Não foi possível carregar. Verifique a configuração.</p>
          <p style="font-size:12px;margin-top:6px;color:#ccc">${e.message}</p>
        </div>`;
    }
  }

  /* ── SIDEBAR ── */
  function buildSidebar() {
    const catList = document.getElementById('cat-list');
    const counts  = {};
    allItems.forEach(i => { counts[i.categoria] = (counts[i.categoria] || 0) + 1; });

    // Update "Todos" count
    document.getElementById('count-Todos').textContent = allItems.length;

    const sorted = Object.keys(counts).sort();
    catList.innerHTML = sorted.map(cat => {
      const cfg = CAT_CONFIG[cat] || { icon: '•', cls: 'cat-outros' };
      return `<button class="cat-btn" data-cat="${escHtml(cat)}" onclick="setCategory('${escHtml(cat)}')">
        <span class="cat-icon">${cfg.icon}</span>
        ${escHtml(cat)}
        <span class="cat-count">${counts[cat]}</span>
      </button>`;
    }).join('');

    document.querySelector('.cat-btn[data-cat="Todos"]')
      .addEventListener('click', () => setCategory('Todos'));
  }

  function setCategory(cat) {
    activeCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.cat === cat));
    document.getElementById('page-title').textContent =
      cat === 'Todos' ? 'Todos os artigos' : cat;
    render();
  }

  /* ── RENDER ── */
  function render() {
    const query = document.getElementById('search').value.trim().toLowerCase();
    let items = allItems;

    if (activeCategory !== 'Todos')
      items = items.filter(i => i.categoria === activeCategory);
    if (query)
      items = items.filter(i =>
        i.titulo.toLowerCase().includes(query) ||
        i.categoria.toLowerCase().includes(query) ||
        i.audiencia.some(a => a.toLowerCase().includes(query)) ||
        i.tags.some(t => t.toLowerCase().includes(query)));

    document.getElementById('total-badge').textContent = `${allItems.length} artigos`;
    document.getElementById('page-count').textContent =
      (query || activeCategory !== 'Todos') ? `${items.length} resultado${items.length !== 1 ? 's' : ''}` : `${allItems.length} artigos`;

    const list = document.getElementById('article-list');

    if (items.length === 0) {
      list.innerHTML = `<div class="empty">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <p>Nenhum resultado para "<strong>${escHtml(query || activeCategory)}</strong>"</p>
      </div>`;
      return;
    }

    list.innerHTML = items.map(item => {
      const cfg = CAT_CONFIG[item.categoria] || { icon: '📌', cls: 'cat-outros' };
      const audTags = item.audiencia.map(a =>
        `<span class="tag tag-aud">${escHtml(a)}</span>`).join('');
      const hubTag = item.fonte === 'FAQ HUB' ? `<span class="tag tag-hub">HUB</span>` : '';
      const novoBadge = isNovo(item) ? '<span class="badge-novo">Novo</span>' : '';
      const titleHtml = highlight(escHtml(item.titulo), query) + novoBadge;
      return `
        <div class="article" data-id="${item.id}">
          <div class="article-header" onclick="toggle(event, this)">
            <div class="article-icon ${cfg.cls}">${cfg.icon}</div>
            <div class="article-info">
              <div class="article-title">${titleHtml}</div>
              <div class="article-meta">
                <span class="tag ${cfg.cls}">${escHtml(item.categoria)}</span>
                ${audTags}${hubTag}
              </div>
            </div>
            <div class="article-right">
              <button class="copy-btn" title="Copiar link" onclick="copyLink(event,'${item.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
              <svg class="chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
          <div class="article-body">
            <div class="article-content"></div>
          </div>
        </div>`;
    }).join('');
  }

  /* ── TOGGLE ── */
  async function toggle(e, header) {
    const art = header.closest('.article');
    const opening = !art.classList.contains('open');
    art.classList.toggle('open');

    if (opening) {
      const contentEl = art.querySelector('.article-content');
      if (!contentEl.dataset.loaded) {
        contentEl.innerHTML = '<span style="color:#ccc;font-style:italic;font-size:13px">Carregando...</span>';
        try {
          const res  = await fetch(`/api/content?id=${art.dataset.id}`);
          const data = await res.json();
          contentEl.innerHTML = data.content
            ? formatContent(data.content)
            : '<span style="color:#ccc;font-style:italic">Sem conteúdo cadastrado.</span>';
          contentEl.dataset.loaded = '1';
        } catch {
          contentEl.innerHTML = '<span style="color:#ccc;font-style:italic">Erro ao carregar.</span>';
        }
      }
    }
  }

  /* ── COPY LINK ── */
  function copyLink(e, id) {
    e.stopPropagation();
    navigator.clipboard.writeText(`${location.origin}${location.pathname}#${id}`).then(() => {
      const btn = e.currentTarget;
      btn.classList.add('copied');
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
      }, 1800);
    });
  }

  /* ── HIGHLIGHT ── */
  function highlight(text, query) {
    if (!query) return text;
    const safe = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${safe})`, 'gi'),
      '<mark style="background:#fef08a;border-radius:2px;padding:0 1px">$1</mark>');
  }

  /* ── FORMAT CONTENT ── */
  function formatContent(text) {
    if (!text) return '';
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/^## (.+)$/gm,   '<strong style="display:block;margin:14px 0 4px;color:#06092b;font-size:14px">$1</strong>')
      .replace(/^### (.+)$/gm,  '<strong style="display:block;margin:10px 0 3px;color:#343a40">$1</strong>')
      .replace(/^#### (.+)$/gm, '<strong style="display:block;margin:8px 0 2px;color:#495057">$1</strong>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/^• (.+)$/gm,    '&nbsp;&nbsp;• $1');
  }

  /* ── ESC HTML ── */
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── VIEW MODE ── */
  function setView(mode) {
    currentView = mode;
    const list = document.getElementById('article-list');
    list.classList.toggle('grid-view', mode === 'grid');
    document.getElementById('btn-list').classList.toggle('active', mode === 'list');
    document.getElementById('btn-grid').classList.toggle('active', mode === 'grid');
  }

  /* ── KEYBOARD ── */
  document.addEventListener('keydown', e => {
    const s = document.getElementById('search');
    if (e.key === '/' && document.activeElement !== s) { e.preventDefault(); s.focus(); s.select(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k')     { e.preventDefault(); s.focus(); s.select(); }
    if (e.key === 'Escape' && document.activeElement === s) { s.value = ''; render(); s.blur(); }
  });

  document.getElementById('search').addEventListener('input', render);
  loadFAQ();
</script>
</body>
</html>
